[package]
name = "woosh-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
mimalloc = "0.1.48"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# The public `rerun` facade re-exports the embedded viewer API when the
# `native_viewer` feature is enabled. Use the published crate so Windows
# builds don't need to clone Rerun's large Git repository.
rerun = { version = "=0.36.1", default-features = false, features = [
  "native_viewer",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
