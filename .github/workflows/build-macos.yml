name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    name: Build and package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            artifact: woosh-viewer-macos-arm64
            package_arch: arm64
            label: Apple Silicon
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artifact: woosh-viewer-macos-intel-x64
            package_arch: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: operator/woosh_viewer
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add "${{ matrix.target }}" --toolchain 1.95.0
      - name: Test
        run: cargo +1.95.0 test --locked --target "${{ matrix.target }}"
      - name: Build release binary
        run: cargo +1.95.0 build --release --locked --target "${{ matrix.target }}"
      - name: Build app bundle, ZIP, and DMG
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh \
            --package-only \
            --arch "${{ matrix.package_arch }}" \
            --binary "${GITHUB_WORKSPACE}/operator/woosh_viewer/target/${{ matrix.target }}/release/woosh-viewer"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            operator/woosh_viewer/dist/${{ matrix.artifact }}.zip
            operator/woosh_viewer/dist/${{ matrix.artifact }}.dmg
            operator/woosh_viewer/dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error
